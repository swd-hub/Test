<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel横断検索</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --izumo-olive: #67571D;
    --izumo-olive-light: #8B7831;
    --izumo-warm: #F7F6F4;
    --izumo-warm-dark: #F0EFE9;
    --border: #E0DDC9;
    --text: #000;
  }
  * { box-sizing: border-box; }
  body {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px;
    background: var(--izumo-warm);
    color: var(--text);
    font-family: "Yu Gothic", "Meiryo", Arial, sans-serif;
    line-height: 1.6;
  }
  h1 {
    margin: 0 0 20px;
    padding: 20px 24px;
    border-top: 5px solid var(--izumo-olive-light);
    border-radius: 5px;
    background: var(--izumo-olive);
    box-shadow: 0 3px 10px rgba(0, 0, 0, .14);
    color: #fff;
    font-size: 1.45em;
    letter-spacing: .04em;
  }
  .panel {
    margin-bottom: 20px;
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: #fff;
    box-shadow: 0 2px 7px rgba(0, 0, 0, .06);
  }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  label, .row strong { color: var(--izumo-olive); font-weight: 700; }
  input[type=text], select {
    min-height: 40px;
    padding: 8px 10px;
    border: 1px solid #B1A887;
    border-radius: 4px;
    background: #fff;
    color: var(--text);
    font: inherit;
  }
  input[type=text] { width: min(100%, 360px); }
  input[type=text]:focus, select:focus, button:focus-visible, a:focus-visible, th.sortable:focus-visible {
    outline: 3px solid rgba(103, 87, 29, .28);
    outline-offset: 2px;
    border-color: var(--izumo-olive);
  }
  .path-display {
    overflow-wrap: anywhere;
    padding: 5px 9px;
    border-left: 3px solid var(--izumo-olive-light);
    background: var(--izumo-warm-dark);
    font-size: .92em;
  }
  select, button {
    min-height: 40px;
    padding: 8px 14px;
    border: 1px solid #B1A887;
    border-radius: 4px;
    background: #fff;
    color: var(--izumo-olive);
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    transition: background-color .15s ease, border-color .15s ease;
  }
  button:hover:not(:disabled), select:hover { border-color: var(--izumo-olive); background: var(--izumo-warm-dark); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary {
    border-color: var(--izumo-olive);
    background: var(--izumo-olive);
    color: #fff;
  }
  button.primary:hover:not(:disabled) { border-color: var(--izumo-olive-light); background: var(--izumo-olive-light); }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
    font-size: .9em;
  }
  th {
    background: var(--izumo-olive);
    color: #fff;
    font-weight: 700;
    white-space: nowrap;
  }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { background: var(--izumo-olive-light); }
  th .arrow { display: inline-block; margin-left: 4px; opacity: .55; font-size: .85em; }
  th[aria-sort="ascending"] .arrow, th[aria-sort="descending"] .arrow { opacity: 1; }
  tbody tr:nth-child(even) { background: var(--izumo-warm); }
  tbody tr:hover { background: var(--izumo-warm-dark); }
  td.val { min-width: 200px; word-break: break-all; }
  th:last-child, td:last-child { min-width: 160px; white-space: nowrap; }
  a { color: var(--izumo-olive); font-weight: 600; }
  a:hover { color: var(--izumo-olive-light); }
  #status {
    margin-top: 12px;
    padding: 10px 12px;
    border-left: 4px solid var(--izumo-olive-light);
    background: var(--izumo-warm-dark);
    color: var(--text);
    white-space: pre-line;
  }
  .note {
    margin: 0 0 14px;
    padding: 9px 12px;
    border-left: 4px solid #D11313;
    background: #F5DFDF;
    color: #A33131;
    font-size: .92em;
  }
  input.path-input { flex: 1 1 520px; min-width: 260px; font-family: Consolas, "Meiryo", monospace; font-size: .9em; }
  .hint { margin: 0 0 14px; color: #666; font-size: .85em; }
  @media (max-width: 600px) {
    body { padding: 14px; }
    h1 { padding: 16px; font-size: 1.25em; }
    .panel { padding: 14px; }
    .row { align-items: stretch; }
    input[type=text] { width: 100%; }
  }
</style>
</head>
<body>
<h1>Excelシート内検索</h1>

<div class="panel">
  <p class="note">※ Chrome または Edge で、このHTMLファイルを開いて使用してください。データは外部に送信されません。</p>
  <div class="row">
    <button class="primary" id="btnPick">検索フォルダを選定</button>
    <button id="btnClear">結果をクリア</button>
  </div>
  <div class="row">
    <label for="base"><strong>保管フォルダのフルパス</strong></label>
    <input type="text" id="base" class="path-input" spellcheck="false"
           placeholder="フルパス：選定した検索フォルダのアドレス欄から貼付">
    <button id="btnPathReset">初期値に戻す</button>
  </div>
  <p class="hint">※ ここに入れたパスが、検索結果の「開く」リンクとコピー用パスの先頭になります（ブラウザの仕様上、フォルダ選定だけではフルパスを取得できないため）。入力内容はこのPCに自動保存されます。</p>
  <div class="row">
    <label for="kw">検索語</label>
    <input type="text" id="kw" placeholder="例: 三島 出雲（スペース区切り）">
    <label for="mode">条件</label>
    <select id="mode">
      <option value="OR">いずれかを含む（OR）</option>
      <option value="AND">すべて含む（AND）</option>
    </select>
  </div>
  <div id="status"></div>
</div>

<div class="panel">
  <div class="row">
    <label for="resFilter">結果の絞り込み</label>
    <input type="text" id="resFilter" placeholder="ファイル名・フォルダ・内容などで絞り込み">
    <button id="btnCsv" disabled>CSV保存（表示中・並び順どおり）</button>
  </div>
  <div class="table-wrap">
    <table id="tbl">
      <thead>
        <tr>
          <th class="sortable" data-col="0" tabindex="0" aria-sort="none">No<span class="arrow">⇅</span></th>
          <th class="sortable" data-col="1" tabindex="0" aria-sort="none">ファイル名<span class="arrow">⇅</span></th>
          <th class="sortable" data-col="2" tabindex="0" aria-sort="none">フォルダ<span class="arrow">⇅</span></th>
          <th class="sortable" data-col="3" tabindex="0" aria-sort="none">シート<span class="arrow">⇅</span></th>
          <th class="sortable" data-col="4" tabindex="0" aria-sort="none">セル<span class="arrow">⇅</span></th>
          <th class="sortable" data-col="5" tabindex="0" aria-sort="none">内容<span class="arrow">⇅</span></th>
          <th>リンク</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
const SUPPORTED_EXT = ['xlsx', 'xlsm'];

// ===== 保管フォルダのフルパス（入力欄 #base。localStorage に保存）=====
const INITIAL_BASE_PATH = 'フルパス：選定した検索フォルダのアドレス欄から貼付';
const BASE_KEY = 'ninteiBasePath';
const baseInput = document.getElementById('base');

function getBasePath() {
  return baseInput.value.trim().replace(/[\\\/]+$/, '');
}
function saveBasePath() {
  try { localStorage.setItem(BASE_KEY, baseInput.value.trim()); } catch (e) { }
}
(function initBasePath() {
  let v = null;
  try { v = localStorage.getItem(BASE_KEY); } catch (e) { }
  baseInput.value = v || INITIAL_BASE_PATH;
})();
baseInput.addEventListener('input', saveBasePath);
document.getElementById('btnPathReset').addEventListener('click', () => {
  baseInput.value = INITIAL_BASE_PATH;
  saveBasePath();
  setStatus('保管フォルダのパスを初期値に戻しました。');
});

let rows = [];                       // 検索結果（複数回の検索で追加される）
let stats = { files: 0, errors: 0 }; // 今回の検索の統計
let selectedDirHandle = null;

// ===== ソート状態 =====
let sortKey = null;      // 現在のソート列（data-col の番号）。null は検索順
let sortDir = 'asc';     // 'asc' | 'desc'
let seqCounter = 0;      // 検索順の連番（No 列のソートに使用）
const collator = new Intl.Collator('ja', { numeric: true, sensitivity: 'base' });
const SORT_GETTERS = [
  r => r._seq,    // 0: No（検索順）
  r => r.file,    // 1: ファイル名
  r => r.folder,  // 2: フォルダ
  r => r.sheet,   // 3: シート
  r => r.cell,    // 4: セル
  r => r.text     // 5: 内容
];

document.getElementById('btnPick').addEventListener('click', selectSearchFolder);
document.getElementById('kw').addEventListener('keydown', event => {
  if (event.key === 'Enter') {
    event.preventDefault();
    runSearch();
  }
});
document.getElementById('btnClear').addEventListener('click', () => {
  rows = [];
  renderResults();
  setStatus('結果をクリアしました。');
});
document.getElementById('resFilter').addEventListener('input', applyResultFilter);
document.getElementById('btnCsv').addEventListener('click', exportCsv);

document.querySelectorAll('#tbl thead th.sortable').forEach(th => {
  th.addEventListener('click', () => setSort(Number(th.dataset.col)));
  th.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      setSort(Number(th.dataset.col));
    }
  });
});

// ===== 前回選んだフォルダの記憶（IndexedDB を使用）=====
function openHandleDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('izumoSearchDb', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveLastDir(handle) {
  const db = await openHandleDb();
  await new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(handle, 'lastDir');
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
  db.close();
}

async function loadLastDir() {
  try {
    const db = await openHandleDb();
    const handle = await new Promise((resolve, reject) => {
      const req = db.transaction('handles').objectStore('handles').get('lastDir');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
    db.close();
    return handle;
  } catch (e) {
    return null;
  }
}

// 検索フォルダを選定（前回のフォルダ、なければ「ドキュメント」から開く）
async function selectSearchFolder() {
  if (!window.showDirectoryPicker) {
    alert('このブラウザは非対応です。Chrome か Edge をご利用ください。');
    return;
  }

  try {
    const lastHandle = await loadLastDir();
    const options = { mode: 'read', startIn: lastHandle || 'documents' };

    selectedDirHandle = await window.showDirectoryPicker(options);
    await saveLastDir(selectedDirHandle).catch(() => {});

    const basePath = getBasePath();
    const baseName = basePath.split('\\').pop();
    const warn = !basePath
      ? '\n※ 保管フォルダのフルパスが未入力です。上の入力欄に入力してください。'
      : (selectedDirHandle.name === baseName)
      ? ''
      : `\n※ 選定フォルダ名が保管フォルダ名（${baseName}）と異なるため、表示されるパスが実際の場所と違う可能性があります。`;
    setStatus(`検索フォルダを選定しました: ${selectedDirHandle.name}${warn}\n検索語を入力して Enter キーを押してください。`);
  } catch (e) {
    if (e.name !== 'AbortError') alert('フォルダを開けませんでした: ' + e.message);
  }
}

// 検索処理
async function runSearch() {
  const keys = normalizeKeys(document.getElementById('kw').value);
  if (keys.length === 0) {
    alert('検索語を入力してください。');
    return;
  }
  if (!selectedDirHandle) {
    alert('先に「検索フォルダを選定」してください。');
    return;
  }

  const isAnd = document.getElementById('mode').value === 'AND';
  const base = getBasePath();

  stats = { files: 0, errors: 0 };
  setStatus('検索中...');
  await scanDir(selectedDirHandle, '', keys, isAnd, base);
  renderResults();

  const hitCount = rows.filter(r => !r.error).length;
  setStatus(`今回の確認ファイル数: ${stats.files} / 結果の合計ヒット件数: ${hitCount} / 今回開けなかった件数: ${stats.errors}`);
}

// フォルダを再帰的に巡回
async function scanDir(dirHandle, relPath, keys, isAnd, base) {
  for await (const entry of dirHandle.values()) {
    if (entry.kind === 'directory') {
      const sub = relPath ? `${relPath}\\${entry.name}` : entry.name;
      await scanDir(entry, sub, keys, isAnd, base);
    } else {
      const ext = entry.name.split('.').pop().toLowerCase();
      if (entry.name.startsWith('~$') || !SUPPORTED_EXT.includes(ext)) continue;
      await searchFile(entry, relPath, keys, isAnd, base);
    }
  }
}

// 1ファイルを検索（ファイル名と内容の両方）
async function searchFile(fh, relFolder, keys, isAnd, base) {
  stats.files++;
  setStatus(`検索中... ${stats.files} 件目: ${fh.name}`);

  const fullPath = base ? [base, relFolder, fh.name].filter(Boolean).join('\\') : null;
  const folderLabel = relFolder || '(選択フォルダ直下)';
  const flags = keys.map(() => false);
  const hits = [];

  // ファイル名での一致
  const nameLower = fh.name.toLowerCase();
  keys.forEach((k, i) => { if (nameLower.includes(k)) flags[i] = true; });
  if (flags.some(Boolean)) {
    hits.push({ sheet: '-', cell: '-', text: '(ファイル名に一致)' });
  }

  // 内容での一致
  try {
    const buf = await (await fh.getFile()).arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    for (const sheetName of wb.SheetNames) {
      const ws = wb.Sheets[sheetName];
      for (const addr of Object.keys(ws)) {
        if (addr[0] === '!') continue;  // 範囲情報などのメタデータを除外
        const cell = ws[addr];
        if (cell.v === undefined || cell.v === null || cell.v === '') continue;
        const text = String(cell.w ?? cell.v);
        const t = text.toLowerCase();
        let anyHit = false;
        keys.forEach((k, i) => {
          if (t.includes(k)) { flags[i] = true; anyHit = true; }
        });
        if (anyHit) hits.push({ sheet: sheetName, cell: addr, text });
      }
    }
  } catch (e) {
    stats.errors++;
    rows.push({ file: fh.name, folder: folderLabel, sheet: '-', cell: '-',
                text: '開けませんでした（' + e.message + '）', path: fullPath, error: true });
    return;
  }

  // AND / OR 判定
  const ok = isAnd ? flags.every(Boolean) : flags.some(Boolean);
  if (!ok) return;

  hits.forEach(h => rows.push({
    file: fh.name, folder: folderLabel, sheet: h.sheet, cell: h.cell,
    text: h.text, path: fullPath, error: false
  }));
}

// ===== ソート処理 =====
function compareValues(a, b) {
  if (typeof a === 'number' && typeof b === 'number') return a - b;
  return collator.compare(String(a ?? ''), String(b ?? ''));
}

function sortRows() {
  if (sortKey === null) return;
  const get = SORT_GETTERS[sortKey];
  const dir = sortDir === 'asc' ? 1 : -1;
  rows.sort((x, y) => {
    const c = compareValues(get(x), get(y));
    return c !== 0 ? c * dir : (x._seq - y._seq);  // 同値は検索順を維持
  });
}

function setSort(col) {
  if (sortKey === col) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortKey = col;
    sortDir = 'asc';
  }
  renderResults();
}

function updateSortIndicators() {
  document.querySelectorAll('#tbl thead th.sortable').forEach(th => {
    const col = Number(th.dataset.col);
    const arrow = th.querySelector('.arrow');
    if (col === sortKey) {
      th.setAttribute('aria-sort', sortDir === 'asc' ? 'ascending' : 'descending');
      arrow.textContent = sortDir === 'asc' ? '▲' : '▼';
    } else {
      th.setAttribute('aria-sort', 'none');
      arrow.textContent = '⇅';
    }
  });
}

// 結果テーブルを描画（textContent を使用して安全に表示）
function renderResults() {
  // 検索順の連番を付与（未付与の行のみ）
  rows.forEach(r => { if (r._seq === undefined) r._seq = ++seqCounter; });
  sortRows();
  updateSortIndicators();

  const tbody = document.querySelector('#tbl tbody');
  tbody.textContent = '';

  rows.forEach((r, i) => {
    const tr = document.createElement('tr');

    [i + 1, r.file, r.folder, r.sheet, r.cell, r.text].forEach((v, idx) => {
      const td = document.createElement('td');
      td.textContent = v;
      if (idx === 5) td.className = 'val';
      tr.appendChild(td);
    });

    // リンク列
    const tdLink = document.createElement('td');
    if (r.path) {
      const a = document.createElement('a');
      a.href = toFileUrl(r.path);
      a.textContent = '開く';
      a.target = '_blank';
      a.rel = 'noopener';
      tdLink.appendChild(a);

      const btn = document.createElement('button');
      btn.textContent = 'パスコピー';
      btn.style.marginLeft = '6px';
      btn.addEventListener('click', () => copyText(r.path));
      tdLink.appendChild(btn);
    } else {
      tdLink.textContent = '(リンク用パス未入力)';
    }
    tr.appendChild(tdLink);

    tbody.appendChild(tr);
  });

  applyResultFilter();
}

// 結果の絞り込み
function applyResultFilter() {
  const q = document.getElementById('resFilter').value.trim().toLowerCase();
  Array.from(document.querySelector('#tbl tbody').rows).forEach(tr => {
    tr.style.display = (!q || tr.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
  updateCsvButton();
}

// ===== CSV保存 =====
function updateCsvButton() {
  const visibleCount = Array.from(document.querySelector('#tbl tbody').rows)
    .filter(tr => tr.style.display !== 'none').length;
  document.getElementById('btnCsv').disabled = visibleCount === 0;
}

// 表示中（絞り込み後）の行を、現在の並び順のままCSVで保存
function exportCsv() {
  const tbody = document.querySelector('#tbl tbody');
  const trs = Array.from(tbody.rows);
  const targets = [];
  trs.forEach((tr, i) => {
    if (tr.style.display !== 'none') targets.push(rows[i]);
  });
  if (targets.length === 0) {
    alert('保存する結果がありません。');
    return;
  }

  const header = ['No', 'ファイル名', 'フォルダ', 'シート', 'セル', '内容', 'パス'];
  const toCsvLine = values => values
    .map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"')
    .join(',');

  const lines = [toCsvLine(header)];
  targets.forEach((r, i) => {
    lines.push(toCsvLine([i + 1, r.file, r.folder, r.sheet, r.cell, r.text, r.path ?? '']));
  });

  // BOM 付き UTF-8（Excel で文字化けしないように）
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });

  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const stamp = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_` +
                `${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  const fileName = `検索結果_${stamp}.csv`;

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);

  setStatus(`CSVを保存しました: ${fileName}（${targets.length} 件）`);
}

// ===== ユーティリティ =====
function normalizeKeys(s) {
  return s.replace(/\u3000/g, ' ').trim().split(/\s+/).filter(Boolean).map(k => k.toLowerCase());
}

// UNCパス・ローカルパスを file:// のURLに変換
function toFileUrl(p) {
  if (p.startsWith('\\\\')) {
    return 'file://' + p.slice(2).split('\\').map(encodeURIComponent).join('/');
  }
  const parts = p.split('\\');
  return 'file:///' + parts[0] + '/' + parts.slice(1).map(encodeURIComponent).join('/');
}

async function copyText(t) {
  try {
    await navigator.clipboard.writeText(t);
    alert('パスをコピーしました。エクスプローラーのアドレスバーに貼り付けると開けます。');
  } catch (e) {
    prompt('このパスをコピーしてください', t);
  }
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

// 初期状態のCSVボタン制御
updateCsvButton();
</script>
</body>
</html>
