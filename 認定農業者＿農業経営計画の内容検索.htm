<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel横断検索</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { font-family: "Yu Gothic", "Meiryo", Arial, sans-serif; margin: 20px; background: #f4f4f4; color: #333; }
  h1 { font-size: 1.4em; }
  .panel { background: #fff; padding: 15px; border-radius: 6px; box-shadow: 0 0 8px rgba(0,0,0,.1); margin-bottom: 15px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  label { font-weight: bold; }
  input[type=text] { width: 320px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
  .path-display { overflow-wrap: anywhere; }
  select, button { padding: 6px 12px; border-radius: 4px; border: 1px solid #888; background: #fff; cursor: pointer; }
  button.primary { background: #007bff; color: #fff; border-color: #007bff; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; vertical-align: top; font-size: .9em; }
  th { background: #e0e0e0; }
  tr:nth-child(even) { background: #f9f9f9; }
  td.val { word-break: break-all; min-width: 200px; }
  th:last-child, td:last-child { white-space: nowrap; min-width: 160px; }
  a { color: #007bff; }
  #status { margin-top: 8px; color: #555; white-space: pre-line; }
  .note { color: #c00; font-size: .9em; margin: 0 0 10px; }
</style>
</head>
<body>
<h1>Excelシート内検索</h1>

<div class="panel">
  <p class="note">※ Chrome または Edge で、このHTMLファイルを開いて使用してください。データは外部に送信されません。</p>
  <div class="row">
    <strong>デフォルトの選択フォルダ（フルパス）</strong>
    <span id="base" class="path-display">\\fs.ad.pref.shimane.jp\農林水産部\東部農林水産振興センター　出雲事務所\農業普及部\R8\084担い手\02認定農業者\050農業経営改善計画認定申請\認定農業者経営改善計画</span>
  </div>
  
  <!-- ＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊　保管しているフォルダ名に変更してください　＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊-->
  
  <div class="row">
    <button class="primary" id="btnPick">検索フォルダを選定</button>
    <button id="btnClear">結果をクリア</button>
  </div>
  <div class="row">
    <label for="kw">検索語</label>
    <input type="text" id="kw" placeholder="例: 三島 出雲（スペース区切り）">
    <label for="mode">条件</label>
    <select id="mode">
      <option value="OR">いずれかを含む（OR）</option>
      <option value="AND">すべて含む（AND）</option>
    </select>
  </div>
  <div id="status"></div>
</div>

<div class="panel">
  <div class="row">
    <label for="resFilter">結果の絞り込み</label>
    <input type="text" id="resFilter" placeholder="ファイル名・フォルダ・内容などで絞り込み">
  </div>
  <div class="table-wrap">
    <table id="tbl">
      <thead>
        <tr><th>No</th><th>ファイル名</th><th>フォルダ</th><th>シート</th><th>セル</th><th>内容</th><th>リンク</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
const SUPPORTED_EXT = ['xlsx', 'xlsm'];
let rows = [];                       // 検索結果（複数回の検索で追加される）
let stats = { files: 0, errors: 0 }; // 今回の検索の統計
let selectedDirHandle = null;

document.getElementById('btnPick').addEventListener('click', selectSearchFolder);
document.getElementById('kw').addEventListener('keydown', event => {
  if (event.key === 'Enter') {
    event.preventDefault();
    runSearch();
  }
});
document.getElementById('btnClear').addEventListener('click', () => {
  rows = [];
  renderResults();
  setStatus('結果をクリアしました。');
});
document.getElementById('resFilter').addEventListener('input', applyResultFilter);

async function selectSearchFolder() {
  if (!window.showDirectoryPicker) {
    alert('このブラウザは非対応です。Chrome か Edge をご利用ください。');
    return;
  }

  try {
    selectedDirHandle = await window.showDirectoryPicker({ mode: 'read' });
    setStatus(`検索フォルダを選定しました: ${selectedDirHandle.name}\n検索語を入力して Enter キーを押してください。`);
  } catch (e) {
    if (e.name !== 'AbortError') alert('フォルダを開けませんでした: ' + e.message);
  }
}

// 検索処理
async function runSearch() {
  const keys = normalizeKeys(document.getElementById('kw').value);
  if (keys.length === 0) {
    alert('検索語を入力してください。');
    return;
  }
  if (!selectedDirHandle) {
    alert('先に「検索フォルダを選定」してください。');
    return;
  }

  const isAnd = document.getElementById('mode').value === 'AND';
  const base = normalizeBase(document.getElementById('base').textContent);

  stats = { files: 0, errors: 0 };
  setStatus('検索中...');
  await scanDir(selectedDirHandle, '', keys, isAnd, base);
  renderResults();

  const hitCount = rows.filter(r => !r.error).length;
  setStatus(`今回の確認ファイル数: ${stats.files} / 結果の合計ヒット件数: ${hitCount} / 今回開けなかった件数: ${stats.errors}`);
}

// フォルダを再帰的に巡回
async function scanDir(dirHandle, relPath, keys, isAnd, base) {
  for await (const entry of dirHandle.values()) {
    if (entry.kind === 'directory') {
      const sub = relPath ? `${relPath}\\${entry.name}` : entry.name;
      await scanDir(entry, sub, keys, isAnd, base);
    } else {
      const ext = entry.name.split('.').pop().toLowerCase();
      if (entry.name.startsWith('~$') || !SUPPORTED_EXT.includes(ext)) continue;
      await searchFile(entry, relPath, keys, isAnd, base);
    }
  }
}

// 1ファイルを検索
async function searchFile(fh, relFolder, keys, isAnd, base) {
  stats.files++;
  setStatus(`検索中... ${stats.files} 件目: ${fh.name}`);

  const fullPath = base ? [base, relFolder, fh.name].filter(Boolean).join('\\') : null;
  const folderLabel = relFolder || '(選択フォルダ直下)';
  const flags = keys.map(() => false);
  const hits = [];

  // ファイル名での一致
  const nameLower = fh.name.toLowerCase();
  keys.forEach((k, i) => { if (nameLower.includes(k)) flags[i] = true; });
  if (flags.some(Boolean)) {
    hits.push({ sheet: '-', cell: '-', text: '(ファイル名に一致)' });
  }

  // 内容での一致
  try {
    const buf = await (await fh.getFile()).arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    for (const sheetName of wb.SheetNames) {
      const ws = wb.Sheets[sheetName];
      for (const addr of Object.keys(ws)) {
        if (addr[0] === '!') continue;  // 範囲情報などのメタデータを除外
        const cell = ws[addr];
        if (cell.v === undefined || cell.v === null || cell.v === '') continue;
        const text = String(cell.w ?? cell.v);
        const t = text.toLowerCase();
        let anyHit = false;
        keys.forEach((k, i) => {
          if (t.includes(k)) { flags[i] = true; anyHit = true; }
        });
        if (anyHit) hits.push({ sheet: sheetName, cell: addr, text });
      }
    }
  } catch (e) {
    stats.errors++;
    rows.push({ file: fh.name, folder: folderLabel, sheet: '-', cell: '-',
                text: '開けませんでした（' + e.message + '）', path: fullPath, error: true });
    return;
  }

  // AND / OR 判定
  const ok = isAnd ? flags.every(Boolean) : flags.some(Boolean);
  if (!ok) return;

  hits.forEach(h => rows.push({
    file: fh.name, folder: folderLabel, sheet: h.sheet, cell: h.cell,
    text: h.text, path: fullPath, error: false
  }));
}

// 結果テーブルを描画（textContent を使用して安全に表示）
function renderResults() {
  const tbody = document.querySelector('#tbl tbody');
  tbody.textContent = '';

  rows.forEach((r, i) => {
    const tr = document.createElement('tr');

    [i + 1, r.file, r.folder, r.sheet, r.cell, r.text].forEach((v, idx) => {
      const td = document.createElement('td');
      td.textContent = v;
      if (idx === 5) td.className = 'val';
      tr.appendChild(td);
    });

    // リンク列（必ず1つ作成する）
    const tdLink = document.createElement('td');
    if (r.path) {
      const a = document.createElement('a');
      a.href = toFileUrl(r.path);
      a.textContent = '開く';
      a.target = '_blank';
      a.rel = 'noopener';
      tdLink.appendChild(a);

      const btn = document.createElement('button');
      btn.textContent = 'パスコピー';
      btn.style.marginLeft = '6px';
      btn.addEventListener('click', () => copyText(r.path));
      tdLink.appendChild(btn);
    } else {
      tdLink.textContent = '(リンク用パス未入力)';
    }
    tr.appendChild(tdLink);

    tbody.appendChild(tr);
  });

  applyResultFilter();
}

// 結果の絞り込み
function applyResultFilter() {
  const q = document.getElementById('resFilter').value.trim().toLowerCase();
  Array.from(document.querySelector('#tbl tbody').rows).forEach(tr => {
    tr.style.display = (!q || tr.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
}

// ユーティリティ
function normalizeKeys(s) {
  return s.replace(/　/g, ' ').trim().split(/\s+/).filter(Boolean).map(k => k.toLowerCase());
}

function normalizeBase(s) {
  return s.trim().replace(/[\\\/]+$/, '');
}

// UNCパス・ローカルパスを file:// のURLに変換
function toFileUrl(p) {
  if (p.startsWith('\\\\')) {
    return 'file://' + p.slice(2).split('\\').map(encodeURIComponent).join('/');
  }
  const parts = p.split('\\');
  return 'file:///' + parts[0] + '/' + parts.slice(1).map(encodeURIComponent).join('/');
}

async function copyText(t) {
  try {
    await navigator.clipboard.writeText(t);
    alert('パスをコピーしました。エクスプローラーのアドレスバーに貼り付けると開けます。');
  } catch (e) {
    prompt('このパスをコピーしてください', t);
  }
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}
</script>
</body>
</html>
